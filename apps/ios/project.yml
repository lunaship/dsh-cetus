name: Cetus
options:
  bundleIdPrefix: dev.deeplinks.ios
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
# 构建元数据（方案 §4 C00）：scripts/build-metadata.mjs 生成的 xcconfig 提供
# DLBuildCommit / DLBuildDate / DLBuildConfiguration / DLBuildContractVersion，
# Info.plist 用 $(...) 引用后在「关于」页展示（不在首页）。构建前必须先生成：
#   node scripts/build-metadata.mjs --platform ios
configFiles:
  Debug: BuildMetadata.xcconfig
  Release: BuildMetadata.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      ENABLE_TESTABILITY: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
packages:
  DLModels:
    path: Packages/DLModels
  DLCore:
    path: Packages/DLCore
  DLSecurity:
    path: Packages/DLSecurity
  DLNet:
    path: Packages/DLNet
  DLRemote:
    path: Packages/DLRemote
  DLUI:
    path: Packages/DLUI
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.18.0"
targets:
  Cetus:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Demo/fixtures
          - Resources/Math
      - path: App/Demo/fixtures
        buildPhase: resources
      - path: App/Resources/Math
        buildPhase: resources
        type: folder
    dependencies:
      - target: NotificationService
        embed: true
      - target: LiveActivity
        embed: true
      - target: Share
        embed: true
      - package: DLModels
      - package: DLCore
      - package: DLSecurity
      - package: DLNet
      - package: DLRemote
      - package: DLUI
    settings:
      base:
        PRODUCT_NAME: Cetus
        # C16 §20.6: Debug and Release must not share one bundle id. The base id
        # is the maintainer-owned legacy value (docs/REBRAND_CETUS.md §3.1); the
        # per-config `.debug` suffix below is added only for Debug, mirroring the
        # Android `applicationIdSuffix` arrangement. Debug keeps the exact id it
        # has always had, so CI, UI tests and installed debug builds are unaffected.
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Cetus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/NotificationService
        excludes:
          - Info.plist
      - path: Packages/DLSecurity/Sources/DLSecurity/PushRegistration.swift
      - path: Packages/DLSecurity/Sources/DLSecurity/PushCrypto.swift
      - path: Packages/DLSecurity/Sources/DLSecurity/PushKeyStore.swift
      - path: Packages/DLSecurity/Sources/DLSecurity/SecureStore.swift
      - path: Packages/DLSecurity/Sources/DLSecurity/KeychainStore.swift
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.notification-service
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/NotificationService/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.notification-service
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.notification-service
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LiveActivity
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: LiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.live-activity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/LiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.live-activity
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.live-activity
  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes:
          - Info.plist
      - path: Packages/DLCore/Sources/DLCore/ShareInbox.swift
      - path: Packages/DLCore/Sources/DLCore/PromptAttachment.swift
    settings:
      base:
        PRODUCT_NAME: Share
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Share/Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.share
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.share
  CetusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Cetus
      - package: DLModels
      - package: DLCore
      - package: DLSecurity
      - package: DLNet
      - package: DLRemote
      - package: DLUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_NAME: CetusTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cetus.app/Cetus"
        BUNDLE_LOADER: "$(TEST_HOST)"
  CetusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CetusUITests
      - path: App/PerformanceFixtureConstants.swift
      - path: App/PerformanceFileSecureStore.swift
    dependencies:
      - target: Cetus
      - package: DLCore
      - package: DLModels
      - package: DLSecurity
    settings:
      base:
        PRODUCT_NAME: CetusUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cetus:
    build:
      targets:
        Cetus: all
        NotificationService: all
        LiveActivity: all
        Share: all
    test:
      targets:
        - CetusTests
        - CetusUITests
  CetusPerformance:
    build:
      targets:
        Cetus: all
        NotificationService: all
        LiveActivity: all
        Share: all
    test:
      environmentVariables:
        PERFORMANCE_FIXTURE: /tmp/dsh-performance-fixture
        PERFORMANCE_CONTROL_URL: $(PERFORMANCE_CONTROL_URL)
        PERFORMANCE_QR_PATH: $(PERFORMANCE_QR_PATH)
        PERFORMANCE_APPEND_STORAGE: $(PERFORMANCE_APPEND_STORAGE)
      targets:
        - CetusUITests
    run:
      config: Debug
    archive:
      config: Release
