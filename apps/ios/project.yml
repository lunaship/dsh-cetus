name: DeepLinks
options:
  bundleIdPrefix: dev.deeplinks.ios
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DLModels:
    path: Packages/DLModels
  DLCore:
    path: Packages/DLCore
  DLSecurity:
    path: Packages/DLSecurity
  DLNet:
    path: Packages/DLNet
  DLRemote:
    path: Packages/DLRemote
  DLUI:
    path: Packages/DLUI
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.18.0"
targets:
  DeepLinks:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Demo/fixtures
          - Resources/Math
      - path: App/Demo/fixtures
        buildPhase: resources
      - path: App/Resources/Math
        buildPhase: resources
        type: folder
    dependencies:
      - target: NotificationService
        embed: true
      - target: LiveActivity
        embed: true
      - target: Share
        embed: true
      - package: DLModels
      - package: DLCore
      - package: DLSecurity
      - package: DLNet
      - package: DLRemote
      - package: DLUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DeepLinks.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/NotificationService
        excludes:
          - Info.plist
      - path: Packages/DLSecurity/Sources/DLSecurity/PushRegistration.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.notification-service
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/NotificationService/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LiveActivity
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.live-activity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/LiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes:
          - Info.plist
      - path: Packages/DLCore/Sources/DLCore/ShareInbox.swift
      - path: Packages/DLCore/Sources/DLCore/PromptAttachment.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Share/Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DeepLinksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DeepLinks
      - package: DLModels
      - package: DLCore
      - package: DLSecurity
      - package: DLNet
      - package: DLUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeepLinks.app/DeepLinks"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DeepLinksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DeepLinksUITests
    dependencies:
      - target: DeepLinks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.deeplinks.ios.debug.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DeepLinks:
    build:
      targets:
        DeepLinks: all
        NotificationService: all
        LiveActivity: all
        Share: all
    test:
      targets:
        - DeepLinksTests
        - DeepLinksUITests
    run:
      config: Debug
    archive:
      config: Release
