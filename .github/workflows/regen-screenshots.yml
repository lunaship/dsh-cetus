name: Regenerate screenshot baselines

# 常驻工作流：只在手动触发时于 Linux 上重录 Compose 截图基线。
# 字体必须和 CI 的 ubuntu-latest 一致，所以不在开发机上跑 updateDebugScreenshotTest 后提交。
# 不会在 push 或 pull_request 时自动执行。
on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew :app:updateDebugScreenshotTest --stacktrace
      # 临时调试（Linux 渲染崩溃定位）：失败时上传测试报告，拿到 ScreenshotRenderException 完整堆栈后删除
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-test-results
          path: apps/android/app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-references
          path: apps/android/app/src/screenshotTestDebug/reference
          if-no-files-found: error
