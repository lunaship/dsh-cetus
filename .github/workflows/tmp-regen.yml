name: TEMP regen baselines (v4 takeover, delete before merge)

on:
  push:
    branches: [ 'v4/**' ]

permissions:
  contents: write

jobs:
  regen:
    if: contains(github.event.head_commit.message, '[regen-baselines]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew :app:updateDebugScreenshotTest --stacktrace
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/screenshotTestDebug/reference
          if git diff --cached --quiet; then echo "no baseline changes"; exit 0; fi
          git commit -m "chore(android): 重生成截图基线（Linux + JDK 21，run ${{ github.run_id }}）"
          git push origin HEAD:${{ github.ref_name }}
