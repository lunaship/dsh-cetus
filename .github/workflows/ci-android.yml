name: CI - Android

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - 'testdata/**'
      - 'docs/MOBILE_SYNC_CONTRACT.md'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'testdata/**'
      - 'docs/MOBILE_SYNC_CONTRACT.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'apps/android/**/*.gradle*'

      - name: Kotlin lint (ktlint)
        # 规则集见 apps/android/.editorconfig（先启用低噪声规则，逐步收紧）。固定版本 + 校验和。
        env:
          KTLINT_VERSION: 1.8.0
          KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  $RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "app/src/**/*.kt" "*.kts" "app/*.kts"

      - name: Run JVM tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Validate Compose screenshots
        run: ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release (R8, unsigned)
        # CI 没有签名材料（维护者密钥只在本机），必须显式声明「只验 R8、不签名」，
        # 否则 build.gradle.kts 的签名守卫会直接让 assembleRelease 失败。
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease=true --stacktrace

      - name: Upload R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r8-mapping-${{ github.sha }}
          path: apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check whitespace errors
        run: git diff --check

  emulator-smoke:
    name: Debug emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'apps/android/**/*.gradle*'

      - name: Enable emulator hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Build debug smoke APKs before starting the emulator
        run: cd apps/android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Cold start and background on an emulator
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            for i in 1 2 3; do adb shell am force-stop dev.deeplinks.debug; adb shell am start -W -n dev.deeplinks.debug/dev.deeplinks.devices.SplashActivity; sleep 2; adb shell pidof dev.deeplinks.debug; done
            adb shell am instrument -w -r -e class dev.deeplinks.StartupSmokeTest dev.deeplinks.debug.test/androidx.test.runner.AndroidJUnitRunner | tee startup-instrumentation.txt
            grep -q 'OK (1 test)' startup-instrumentation.txt
            # 第 5 步 D1：公式 / Mermaid 的离屏 WebView 渲染链路此前从未在 CI 真机验证（该 job 只 assemble 不执行）。
            # 按仓库约定走 debug 变体 + 手动 am instrument（AGP 设备测试收尾会卸载被测包，绝不跑 connectedRelease）。
            adb shell am instrument -w -r -e class dev.deeplinks.native.MathRendererInstrumentedTest dev.deeplinks.debug.test/androidx.test.runner.AndroidJUnitRunner | tee math-renderer-instrumentation.txt
            # 失败时把 MathRenderer 的诊断日志打出来（render: evaluate returned null / JS ok=false / invalid size /
            # ensureWebView returned null），否则只剩 AssertionError 没法定位。写成单行以保持本 step 逐行 scalar 合法。
            if ! grep -q 'OK (2 tests)' math-renderer-instrumentation.txt; then echo '===== MathRenderer diagnostics ====='; adb logcat -d -s MathRenderer:W MathRenderer:E Chromium:W WebViewFactory:E; echo '===== startup-errors ====='; tail -40 startup-errors.txt 2>/dev/null; exit 1; fi
            grep -q 'OK (2 tests)' math-renderer-instrumentation.txt
            adb shell am instrument -w -r -e class dev.deeplinks.native.MermaidRendererInstrumentedTest dev.deeplinks.debug.test/androidx.test.runner.AndroidJUnitRunner | tee mermaid-renderer-instrumentation.txt
            grep -q 'OK (1 test)' mermaid-renderer-instrumentation.txt
            # 第 5 步 D5：TokenCrypto 并发首生（删测试密钥后 16 线程同时首次 encrypt 全部可解密）
            adb shell am instrument -w -r -e class dev.deeplinks.core.TokenCryptoConcurrencyTest dev.deeplinks.debug.test/androidx.test.runner.AndroidJUnitRunner | tee token-crypto-instrumentation.txt
            grep -q 'OK (1 test)' token-crypto-instrumentation.txt
            adb logcat -d -s AndroidRuntime:E StrictMode:E > startup-errors.txt
            test ! -s startup-errors.txt || ! grep -E 'FATAL EXCEPTION|StrictMode|NetworkOnMainThreadException' startup-errors.txt

      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-smoke-diagnostics
          path: |
            startup-instrumentation.txt
            startup-errors.txt
            math-renderer-instrumentation.txt
            mermaid-renderer-instrumentation.txt
            token-crypto-instrumentation.txt
          if-no-files-found: ignore
