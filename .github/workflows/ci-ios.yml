name: CI iOS

on:
  pull_request:
    branches: [ios/main, main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ci-ios.yml'
      - 'scripts/check-ios-locales.mjs'
      - 'scripts/check-ios-locales.test.mjs'
  push:
    branches: [ios/main, main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ci-ios.yml'
      - 'scripts/check-ios-locales.mjs'
      - 'scripts/check-ios-locales.test.mjs'

permissions:
  contents: read

concurrency:
  group: dsh-links-ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check locale catalogs
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/check-ios-locales.mjs
          node --test scripts/check-ios-locales.test.mjs

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install tools
        run: brew install xcodegen swift-format

      - name: Check formatting
        run: swift-format lint --strict --recursive --configuration .swift-format .

      - name: Generate build metadata
        working-directory: ${{ github.workspace }}
        run: node scripts/build-metadata.mjs --platform ios

      - name: Generate project
        run: xcodegen generate

      - name: Build Debug and Release
        run: |
          set -eu
          for config in Debug Release; do
            xcodebuild \
              -scheme Cetus \
              -destination 'generic/platform=iOS Simulator' \
              -configuration "$config" \
              build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          done

  test:
    name: iOS unit tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate build metadata
        working-directory: ${{ github.workspace }}
        run: node scripts/build-metadata.mjs --platform ios

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -eu
          DEST=$(sh scripts/simulator-destination.sh)
          xcodebuild \
            -scheme Cetus \
            -destination "$DEST" \
            -only-testing:CetusTests/ModelsLoadTests \
            -only-testing:CetusTests/TokenUsageTests \
            -only-testing:CetusTests/DemoFixturesTests \
            -only-testing:CetusTests/ContextInjectionContractTests \
            -only-testing:CetusTests/MobileModelsContractTests \
            -only-testing:CetusTests/MobileContractFixturesTests \
            -only-testing:CetusTests/HostStoreContractTests \
            -only-testing:CetusTests/TLSFingerprintContractTests \
            -only-testing:CetusTests/SSEClientContractTests \
            -only-testing:CetusTests/HostClientContractTests \
            -only-testing:CetusTests/RequestStateContractTests \
            -only-testing:CetusTests/RouteSelectorContractTests \
            -only-testing:CetusTests/PairingContractTests \
            -only-testing:CetusTests/PairingFlowTests \
            -only-testing:CetusTests/PairingFailureTests \
            -only-testing:CetusTests/PairingPhotoDecoderTests \
            -only-testing:CetusTests/InboxCatalogTests \
            -only-testing:CetusTests/InboxFlowTests \
            -only-testing:CetusTests/TranscriptTests \
            -only-testing:CetusTests/TranscriptSnapshotTests \
            -only-testing:CetusTests/ConversationFlowTests \
            -only-testing:CetusTests/PromptAttachmentTests \
            -only-testing:CetusTests/ShareInboxTests \
            -only-testing:CetusTests/LiveActivityTests \
            -only-testing:CetusTests/PrivacyCoverTests \
            -only-testing:CetusTests/DlpFrameTests \
            -only-testing:CetusTests/DlpVectorTests \
            -only-testing:CetusTests/RemoteHTTP1WireTests \
            -only-testing:CetusTests/RemoteInnerTLSTests \
            -only-testing:CetusTests/ConversationStatusTests \
            -only-testing:CetusTests/ConversationStatusFlowTests \
            -only-testing:CetusTests/PhoneDecisionTests \
            -only-testing:CetusTests/TrajectoryTests \
            -only-testing:CetusTests/NewTaskTests \
            -only-testing:CetusTests/ChatSheetTests \
            -only-testing:CetusTests/QuestionRawJSONTests \
            -only-testing:CetusTests/QuestionNavigationTests \
            -only-testing:CetusTests/ChatControlsServiceTests \
            -only-testing:CetusTests/IntralineDiffContractTests \
            -only-testing:CetusTests/ReviewTests \
            -only-testing:CetusTests/SettingsTests \
            -only-testing:CetusTests/SettingsAccountTests \
            -only-testing:CetusTests/SettingsModelsTests \
            -only-testing:CetusTests/WideLayoutTests \
            -only-testing:CetusTests/PreviewProxyTests \
            -only-testing:CetusTests/PushOpenRouteTests \
            -only-testing:CetusTests/PushRegistrationWireTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          (
            cd Packages/DLSecurity
            xcodebuild \
              -scheme DLSecurity \
              -destination "$DEST" \
              -only-testing:DLSecurityTests/PushRegistrationTests \
              test \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          )

  screenshots:
    name: iOS screenshot check
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate build metadata
        working-directory: ${{ github.workspace }}
        run: node scripts/build-metadata.mjs --platform ios

      - name: Generate project
        run: xcodegen generate

      - name: Compare screenshot baselines
        run: |
          set -eu
          DEST=$(sh scripts/simulator-destination.sh)
          xcodebuild \
            -scheme Cetus \
            -destination "$DEST" \
            -skip-testing:CetusTests/ModelsLoadTests \
            -skip-testing:CetusTests/TokenUsageTests \
            -skip-testing:CetusTests/DemoFixturesTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
