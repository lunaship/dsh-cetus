name: TEMP merge main into sync branch (v4 takeover, delete before merge)

on:
  push:
    branches: [ 'v4/**' ]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-main]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Merge main, keep redesign/v4 baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true
          git diff --name-only --diff-filter=U | while IFS= read -r f; do
            case "$f" in
              *.png) ;;
              *) echo "unexpected text conflict: $f"; exit 1 ;;
            esac
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout --ours -- "$f" && git add -- "$f"
            else
              git rm -q -f -- "$f"
            fi
          done
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then echo "still unmerged"; git status; exit 1; fi
          git commit -m "chore: 合入 main（截图基线以 redesign/v4 为准，run ${{ github.run_id }}）"
          git push origin HEAD:${{ github.ref_name }}
