name: Regenerate screenshot baselines (temporary)

# 临时工作流：Compose 截图基线必须与 CI（Linux）同平台生成，否则像素比对会因字体渲染差异失败。
# 这里在 ubuntu-latest 上跑 updateDebugScreenshotTest，把 reference 目录作为 artifact 上传，
# 由维护者下载后提交；用完即删。
on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerate references
        run: ./gradlew :app:updateDebugScreenshotTest --stacktrace

      - name: Upload references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-references
          path: apps/android/app/src/screenshotTestDebug/reference
          if-no-files-found: error
