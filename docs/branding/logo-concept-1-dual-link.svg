<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dl-grad-1" x1="15" y1="85" x2="85" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3F5BD6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="dl-grad-accent" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B9DFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="dl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background soft ambient circle -->
  <circle cx="50" cy="50" r="42" fill="#3F5BD6" fill-opacity="0.08"/>
  
  <!-- Left node loop (Mobile) -->
  <path d="M 38 62 C 28 52 28 36 38 26 C 48 16 62 18 70 26 L 62 34 C 57 29 48 27 41 34 C 34 41 34 51 41 58 Z" 
        fill="url(#dl-grad-1)"/>
        
  <!-- Right node loop (Host/PC) -->
  <path d="M 62 38 C 72 48 72 64 62 74 C 52 84 38 82 30 74 L 38 66 C 43 71 52 73 59 66 C 66 59 66 49 59 42 Z" 
        fill="url(#dl-grad-1)"/>
        
  <!-- Interlocking link core & energy node -->
  <circle cx="50" cy="50" r="6" fill="url(#dl-grad-accent)" filter="url(#dl-glow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
</svg>
