<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dl-grad-2" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F5BD6"/>
      <stop offset="100%" stop-color="#8B9DFF"/>
    </linearGradient>
    <linearGradient id="dl-grad-inner" x1="30" y1="70" x2="70" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3F5BD6"/>
    </linearGradient>
  </defs>
  <!-- Outer Monogram 'D' silhouette with precision radii -->
  <path d="M 28 20 
           L 54 20 
           C 72 20 84 32 84 50 
           C 84 68 72 80 54 80 
           L 28 80 
           Z" 
        stroke="url(#dl-grad-2)" 
        stroke-width="8" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Inner 'L' + terminal chevron connection flow -->
  <path d="M 42 36 
           L 42 64 
           L 66 64" 
        stroke="url(#dl-grad-inner)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Glowing anchor pulse at terminal corner -->
  <circle cx="42" cy="64" r="5" fill="#FFFFFF"/>
  <circle cx="66" cy="64" r="4" fill="#8B9DFF"/>
</svg>
